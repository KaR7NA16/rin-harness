apiVersion: rin.dev/v1
kind: EnvironmentProfile
metadata:
  id: scientific-base
  name: Scientific base
  version: 1.0.0
spec:
  packages:
    - system-git
    - system-make
    - system-gcc
    - system-g++
    - python-numpy
    - python-pandas
    - python-scipy
    - python-scikit-learn
    - python-matplotlib
    - python-jupyter
    - python-pytest
  verify:
    pythonImports: [numpy, pandas, scipy, sklearn, matplotlib]
