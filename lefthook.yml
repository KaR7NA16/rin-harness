# Git hooks (lefthook). Keep these local checkpoints fast; CI owns the full
# repository-wide gate matrix.
# Install: `lefthook install` (runs automatically via postinstall).

pre-commit:
  jobs:
    - name: lint (staged)
      glob: '*.{ts,tsx,mts,cts,mjs}'
      run: pnpm exec oxlint -c rin/.oxlintrc.json --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - name: whitespace (staged)
      run: git diff --cached --check

pre-push:
  jobs:
    - name: typecheck
      run: pnpm run rin:typecheck