# Build and attach the rin desktop app release artifacts: a Windows NSIS
# installer (.exe) and a Linux Debian package (.deb), two of rin's three
# release forms (the third is the @rin/* npm packages). A rin-v* tag (or a
# manual dispatch) builds web-ui, runs tauri build, and attaches the artifacts
# to the matching GitHub Release.
#
# The packaged host sidecar (bundle.externalBin) is a hard prerequisite for
# tauri build; its build script is not yet landed, so each build job carries a
# marked placeholder where that step goes (see rin/gui/gui/scripts/build-sidecar.md).
name: Release (rin desktop)

on:
  push:
    tags: ['rin-v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  RIN_NODE_VERSION: '22'

jobs:
  linux-deb:
    name: Linux (.deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.RIN_NODE_VERSION }}

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build web-ui
        run: pnpm run rin:build

      # TODO(rin-release): build the packaged host sidecar into
      # rin/gui/gui/src-tauri/binaries/rin-sidecar-<target-triple> before
      # tauri build; bundle.externalBin fails without it. Uncomment once
      # scripts/build-sidecar.ts lands (see rin/gui/gui/scripts/build-sidecar.md).
      # - name: Build host sidecar
      #   run: pnpm run build:sidecar

      - name: Build Debian package
        run: pnpm --filter @rin/gui run tauri build --bundles deb

      - uses: actions/upload-artifact@v4
        with:
          name: rin-linux-deb
          path: rin/gui/gui/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 7

  windows-exe:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.RIN_NODE_VERSION }}

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build web-ui
        run: pnpm run rin:build

      # TODO(rin-release): build the packaged host sidecar into
      # rin/gui/gui/src-tauri/binaries/rin-sidecar-<target-triple>.exe before
      # tauri build; bundle.externalBin fails without it. Uncomment once
      # scripts/build-sidecar.ts lands (see rin/gui/gui/scripts/build-sidecar.md).
      # - name: Build host sidecar
      #   run: pnpm run build:sidecar

      - name: Build NSIS installer
        run: pnpm --filter @rin/gui run tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: rin-windows-exe
          path: rin/gui/gui/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: Attach GitHub Release
    needs: [linux-deb, windows-exe]
    if: startsWith(github.ref, 'refs/tags/rin-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rin-linux-deb
          path: dist/linux

      - uses: actions/download-artifact@v4
        with:
          name: rin-windows-exe
          path: dist/windows

      - name: Create GitHub Release and attach artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/linux/*.deb dist/windows/*.exe --repo "${{ github.repository }}" --generate-notes
