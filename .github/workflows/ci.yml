name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v2
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sync:references
      - run: git diff --exit-code -- tsconfig.json tsconfig.base.json 'apps/*/tsconfig.json' 'packages/*/*/tsconfig.json'
      - run: pnpm metadata
      - run: pnpm hygiene
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:coverage
      - run: pnpm smoke
