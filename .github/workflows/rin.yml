name: rin

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  rin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm rin:metadata
      - run: pnpm rin:typecheck
      - run: pnpm rin:lint
      - run: pnpm rin:hygiene
      - run: pnpm rin:test
      - run: pnpm rin:test:coverage
      - run: pnpm rin:smoke