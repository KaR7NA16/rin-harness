# @rin/bundle dsh harness patch layer — generated from src/cordis.yml
# (regenerate with the verify-rin-cordis gate; it asserts this file matches
# src/cordis.yml row-for-row). Declared by dsh.bundle.patch so the dsh
# harness profile mechanism stacks this assembly as a bundle layer over
# dsh-base. The rin-providers row provides the !!js path helpers; rows whose
# config interpolates one declare it in `inject`, so the loader defers their
# expression resolution until the service exists (dsh web-app precedent).
- insert:
    - id: rin-providers
      name: '@rin/bundle/providers'
    - id: repository
      name: '@rin/repository'
    - id: environment
      name: '@rin/environment'
    - id: filesystem
      name: '@rin/filesystem'
    - id: session-backup
      name: '@rin/session-backup'
    - id: knowledge
      name: '@rin/knowledge'
      inject: [rinHome]
      config:
        dbPath: !!js rinHome('knowledge/knowledge.db')
        configHome: !!js rinHome()
    - id: knowledge-graph
      name: '@rin/knowledge-graph'
      inject: [rinHome, builtinRepositoryRoot]
      config:
        dbPath: !!js rinHome('knowledge-graph.db')
        knowledgeDbPath: !!js rinHome('knowledge/knowledge.db')
        repositoryRoot: !!js builtinRepositoryRoot()
        filesystemRoots:
          - !!js rinHome('notes')
          - !!js builtinRepositoryRoot()
    - id: prompt-memory
      name: '@rin/prompt-memory'
      inject: [rinHome]
      config:
        configRoot: !!js rinHome('prompt-memory')
        initialSoul: >-
          # Rin


          A harness assistant built on the DeepSeek Harness base with the @rin
          asset layer.
    - id: skill-memory
      name: '@rin/skill-memory'
      inject: [rinHome]
      config:
        roots:
          globalConfigRoot: !!js rinHome()
          projectConfigRoot: !!js rinHome()
    - id: session-search
      name: '@rin/session-search'
      inject: [rinHome]
      config:
        configRoot: !!js rinHome('session-search')
    - id: evolution
      name: '@rin/evolution'
      inject: [rinHome]
      config:
        globalConfigRoot: !!js rinHome('evolution')
        reviewModel: !!js |-
          (async (prompt, model) => {
            const llm = ctx.get('llm')
            if (!llm || typeof llm.stream !== 'function') {
              throw new Error('rin evolution: reviewModel requires a composed dsh llm seam')
            }
            const provider = llm.listProviders?.()[0]?.id
            if (!provider) throw new Error('rin evolution: no llm provider registered')
            const text = []
            for await (const chunk of llm.stream({
              provider,
              model,
              messages: [{
                role: 'user',
                content: [{ type: 'text', text: prompt }],
                source: { kind: 'user' },
                id: crypto.randomUUID(),
              }],
            })) {
              if (chunk.type === 'finish') {
                const reason = chunk.reason
                if (reason.kind === 'error' || reason.kind === 'aborted') {
                  throw new Error('rin evolution: review model call failed: ' + (reason.failure ? reason.failure.message : reason.kind))
                }
              }
              if (chunk.type === 'text-delta' && typeof chunk.text === 'string') text.push(chunk.text)
            }
            return text.join('')
          })
    - id: token-optimization
      name: '@rin/token-optimization'
    - id: codegraph
      name: '@rin/codegraph'
    - id: smart-pruning
      name: '@rin/smart-pruning'
    - id: notes
      name: '@rin/notes'
      inject: [rinHome]
      config:
        vaultRoot: !!js rinHome('notes')
    - id: agents
      name: '@rin/agents'
      inject: [rinHome, builtinRepositoryRoot]
      config:
        agentsHome: !!js rinHome('agents')
        defaultRepositoryRoot: !!js builtinRepositoryRoot()
    - id: plugins
      name: '@rin/plugins'
    - id: sandboxes
      name: '@rin/sandboxes'
      inject: [rinHome]
      config:
        profilesPath: !!js rinHome('sandbox.yaml')
    - id: tasks
      name: '@rin/tasks'
      inject: [rinHome]
      config:
        tasksRoot: !!js rinHome('tasks')
    - id: mcp
      name: '@rin/mcp'
      inject: [rinHome]
      config:
        storeRoot: !!js rinHome('mcp')
    - id: mcp-client
      name: '@rin/mcp-client'
    - id: provider-probe
      name: '@rin/provider-probe'
    - id: computer-use
      name: '@rin/computer-use'
      inject: [rinHome]
      config:
        configRoot: !!js rinHome('computer-use')
    - id: agent-migration
      name: '@rin/agent-migration'
    - id: teams
      name: '@rin/teams'
      inject: [rinHome]
      config:
        teamsHome: !!js rinHome('teams')
    - id: brief
      name: '@rin/brief'
    - id: review
      name: '@rin/review'
    - id: monitor
      name: '@rin/monitor'
    - id: doctor
      name: '@rin/doctor'
    - id: storage
      name: '@deepseek-ai/dsh-storage'
    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      inject: [rinHome]
      config:
        root: !!js rinHome('storage')
    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json
    - id: workspace
      name: '@deepseek-ai/dsh-workspace'
    - id: web-server
      name: '@rin/web-server'
      inject: [rinHome, builtinRepositoryRoot, webUiDistRoot]
      config:
        port: 8320
        host: 127.0.0.1
        enabled: true
        repositoryRoot: !!js builtinRepositoryRoot()
        staticRoot: !!js webUiDistRoot()
        knowledgeDbPath: !!js rinHome('knowledge/knowledge.db')
        knowledgeSourcesRoots:
          - !!js rinHome('knowledge/sources')
        skillMemoryRoots:
          globalConfigRoot: !!js rinHome()
          projectConfigRoot: !!js rinHome()
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'
    - id: time-context
      name: '@deepseek-ai/dsh-time-context'
    - id: terminal
      name: '@deepseek-ai/dsh-terminal'
    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
    - id: tool-terminal
      name: '@deepseek-ai/dsh-tool-terminal'
    - id: tool-bash-persistent
      name: '@deepseek-ai/dsh-tool-bash-persistent'
    - id: lsp
      name: '@deepseek-ai/dsh-lsp'
    - id: lsp-stdio
      name: '@deepseek-ai/dsh-lsp-stdio'
      disabled: true
    - id: tool-lsp
      name: '@deepseek-ai/dsh-tool-lsp'
    - id: schedule
      name: '@deepseek-ai/dsh-schedule'
    - id: tool-session-query
      name: '@deepseek-ai/dsh-tool-session-query'
