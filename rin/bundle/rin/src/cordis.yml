# @rin/bundle — the declarative @rin plugin entry list.
#
# The @deepseek-ai/dsh-base core is applied by the launcher (@rin/cli) as the
# patch layer below this list (see @rin/bundle's baseBundlePatchPath), so this
# file declares only the @rin rows and never re-states dsh internals. The dsh
# Web bundle @deepseek-ai/dsh-web-app is deliberately absent (MIGRATION.md §8
# decision 10): dsh's native Web UI (3080) stays reachable through
# 'dsh --profile web' and is never assembled by 'rin'.
#
# Paths use !!js helpers the launcher provides on the boot context:
#   rinHome(subpath?)        -> $RIN_HOME or ~/.rin, then the optional subpath
#   builtinRepositoryRoot()  -> the built-in asset repository beside this package
#   webUiDistRoot()          -> @rin/web-ui dist (the one UI served at 8320 and embedded by @rin/gui)
# Override any path by setting RIN_HOME, or replace a row's config through the
# launcher's --port/--host/--url flags or a config override layer.

- id: repository
  name: '@rin/repository'

- id: environment
  name: '@rin/environment'

- id: filesystem
  name: '@rin/filesystem'

- id: session-backup
  name: '@rin/session-backup'

- id: knowledge
  name: '@rin/knowledge'
  config:
    dbPath: !!js rinHome('knowledge/knowledge.db')
    configHome: !!js rinHome()

- id: prompt-memory
  name: '@rin/prompt-memory'
  config:
    configRoot: !!js rinHome('prompt-memory')
    initialSoul: |-
      # Rin

      A harness assistant built on the DeepSeek Harness base with the @rin asset layer.

- id: skill-memory
  name: '@rin/skill-memory'
  config:
    roots:
      globalConfigRoot: !!js rinHome()
      projectConfigRoot: !!js rinHome()

- id: session-search
  name: '@rin/session-search'
  config:
    configRoot: !!js rinHome('session-search')

- id: evolution
  name: '@rin/evolution'
  config:
    globalConfigRoot: !!js rinHome('evolution')
    reviewModel: !!js |-
      (async (prompt, model) => {
        const llm = ctx.get('llm')
        if (!llm || typeof llm.stream !== 'function') {
          throw new Error('rin evolution: reviewModel requires a composed dsh llm seam')
        }
        const provider = llm.listProviders?.()[0]?.id
        if (!provider) throw new Error('rin evolution: no llm provider registered')
        const text = []
        for await (const chunk of llm.stream({
          provider,
          model,
          messages: [{
            role: 'user',
            content: [{ type: 'text', text: prompt }],
            source: { kind: 'user' },
            id: crypto.randomUUID(),
          }],
        })) {
          if (chunk.type === 'finish') {
            const reason = chunk.reason
            if (reason.kind === 'error' || reason.kind === 'aborted') {
              throw new Error('rin evolution: review model call failed: ' + (reason.failure ? reason.failure.message : reason.kind))
            }
          }
          if (chunk.type === 'text-delta' && typeof chunk.text === 'string') text.push(chunk.text)
        }
        return text.join('')
      })

- id: token-optimization
  name: '@rin/token-optimization'

- id: codegraph
  name: '@rin/codegraph'

- id: smart-pruning
  name: '@rin/smart-pruning'

- id: notes
  name: '@rin/notes'
  config:
    vaultRoot: !!js rinHome('notes')

- id: agents
  name: '@rin/agents'
  config:
    agentsHome: !!js rinHome('agents')
    defaultRepositoryRoot: !!js builtinRepositoryRoot()

- id: plugins
  name: '@rin/plugins'

- id: sandboxes
  name: '@rin/sandboxes'
  config:
    profilesPath: !!js rinHome('sandbox.yaml')

- id: tasks
  name: '@rin/tasks'
  config:
    tasksRoot: !!js rinHome('tasks')

- id: mcp
  name: '@rin/mcp'
  config:
    storeRoot: !!js rinHome('mcp')

# The MCP client bridge: mounts one @deepseek-ai/dsh-mcp-client instance per
# configured non-disabled server in the store above, so their tools reach the
# model as mcp__<server>__<tool>. Requires the dsh tools registry (in dsh-base).
- id: mcp-client
  name: '@rin/mcp-client'

- id: provider-probe
  name: '@rin/provider-probe'

- id: computer-use
  name: '@rin/computer-use'
  config:
    configRoot: !!js rinHome('computer-use')

# homeDir omitted: scanAgentMigration defaults to the OS home (external
# ~/.claude / ~/.codex agent configs), not RIN_HOME.
- id: agent-migration
  name: '@rin/agent-migration'

- id: teams
  name: '@rin/teams'
  config:
    teamsHome: !!js rinHome('teams')

# LLM-driven session/artifact capabilities: the brief tool + /brief command
# and the review_artifact tool + /review + /security-review commands, all over
# the dsh llm seam (dsh-base).
- id: brief
  name: '@rin/brief'

- id: review
  name: '@rin/review'

# Host performance snapshot service (ctx.monitor) + the monitor_snapshot tool;
# the web-server route reads it through ctx.get('monitor') at request time.
- id: monitor
  name: '@rin/monitor'

# Host self-diagnostic service (ctx.doctor) + the doctor tool; the web-server
# /api/doctor route reads it through ctx.get('doctor') at request time.
- id: doctor
  name: '@rin/doctor'

# recent-projects data source (D spec §6): the workspace registry rides the
# storage hub + json backend. storage-domain routes `backend: json`; workspace
# injects storageDomain + sessionPersistence (the latter already in dsh-base).
- id: storage
  name: '@deepseek-ai/dsh-storage'

- id: storage-json
  name: '@deepseek-ai/dsh-storage-json'
  config:
    root: !!js rinHome('storage')

- id: storage-domain
  name: '@deepseek-ai/dsh-storage-domain'
  config:
    backend: json

- id: workspace
  name: '@deepseek-ai/dsh-workspace'

- id: web-server
  name: '@rin/web-server'
  config:
    port: 8320
    host: 127.0.0.1
    enabled: true
    repositoryRoot: !!js builtinRepositoryRoot()
    staticRoot: !!js webUiDistRoot()
    knowledgeDbPath: !!js rinHome('knowledge/knowledge.db')
    knowledgeSourcesRoots:
      - !!js rinHome('knowledge/sources')
    skillMemoryRoots:
      globalConfigRoot: !!js rinHome()
      projectConfigRoot: !!js rinHome()

# ── rin extension — dsh model tools ──────────────────────────────────────────
# Model-facing dsh tool capabilities composed over the dsh-base seam services
# (tools / systemPrompt / agents / sessions / sessionPersistence / subprocess /
# sandboxPolicy / fs / sessionQuery). Rows are ordered per group: the capability
# Service first, then its providers, then the tool consumer.
#
# lsp-stdio requires a non-empty `servers` table naming the language servers to
# run, and no deployment-neutral default exists (see lsp-stdio Config), so the
# backend row is disabled by default to keep the host bootable. A deployment
# enables LSP by re-stating this row (disabled: false) plus a `servers` table
# in a later patch layer (dsh precedent: examples/headless-agent/e2b.cordis.yml).
#
# code-runtime backs the run_code transport: the launcher sets the dsh tools row
# to mode 'both' (host.ts override), and this worker-thread provider registers
# the ctx.codeRuntime that mode requires. The abstract Service Definition
# (@deepseek-ai/dsh-code-runtime) is a dependency, never a row — Cordis
# instantiates service-class rows, so an abstract class cannot be mounted (dsh
# precedent: the headless and web bundles mount the provider only).
#
# time-context injects the dsh-base agents registry and stamps the model's
# wall-clock reading into each eligible pre-step request; defaults suffice.
- id: code-runtime
  name: '@deepseek-ai/dsh-code-runtime-worker-thread'

- id: time-context
  name: '@deepseek-ai/dsh-time-context'

- id: terminal
  name: '@deepseek-ai/dsh-terminal'

- id: terminal-bash
  name: '@deepseek-ai/dsh-terminal-bash'

- id: tool-terminal
  name: '@deepseek-ai/dsh-tool-terminal'

# Persistent bash over the terminal chain: registers the same `bash` tool name
# as the dsh-base tool-bash row, so the launcher disables that row (host.ts
# override) and only this persistent variant is mounted.
- id: tool-bash-persistent
  name: '@deepseek-ai/dsh-tool-bash-persistent'

- id: lsp
  name: '@deepseek-ai/dsh-lsp'

- id: lsp-stdio
  name: '@deepseek-ai/dsh-lsp-stdio'
  disabled: true

- id: tool-lsp
  name: '@deepseek-ai/dsh-tool-lsp'

- id: schedule
  name: '@deepseek-ai/dsh-schedule'

- id: tool-session-query
  name: '@deepseek-ai/dsh-tool-session-query'