# rin desktop GUI shell (Tauri 2).
#
# The shell is a desktop-only thin wrapper: it spawns the rin host and embeds
# the rin web-ui. Mobile targets are out of scope for Phase 8, so no [lib]
# with staticlib/cdylib is declared.

[package]
name = "rin-gui"
version = "0.1.0"
description = "rin desktop GUI shell: a Tauri 2 thin shell embedding the rin web-ui"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon enables the tauri::tray API used for the system tray.
tauri = { version = "2", features = ["tray-icon"] }
# shell/process plugins are registered for the frontend-driven spawn surface and
# future sidecar management; the host itself is spawned via std::process::Command
# in main.rs so its lifetime is owned by a single reap path.
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
# Ready for host-config serialization (status payloads, launch args).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
