<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <link rel="preload" as="image" href="/app-icon.png" />
    <title>rin</title>
    <script>
      try {
        const theme = localStorage.getItem('rin-theme') === 'dark' ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <style>
      :root {
        --boot-background: #f8f9fa;
        --boot-surface: #ffffff;
        --boot-border: rgba(0, 0, 0, 0.08);
        --boot-shadow: rgba(29, 29, 31, 0.14);
      }

      :root[data-theme="dark"] {
        --boot-background: #111315;
        --boot-surface: #0f1114;
        --boot-border: rgba(244, 244, 245, 0.13);
        --boot-shadow: rgba(0, 0, 0, 0.34);
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--boot-background);
      }

      .boot-splash {
        position: fixed;
        z-index: 9999;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        opacity: 1;
        background: var(--boot-background);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        isolation: isolate;
        user-select: none;
        -webkit-user-select: none;
        -webkit-app-region: drag;
      }

      .boot-splash.boot-splash-exit {
        display: none;
        pointer-events: none;
      }

      .boot-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 26px;
        color: rgba(140, 160, 190, 0.9);
      }
      .boot-loading-seal {
        width: 76px;
        height: 76px;
        border-radius: 20px;
        opacity: 0.62;
        animation: boot-seal-pulse 2.2s ease-in-out infinite;
      }
      @keyframes boot-seal-pulse {
        0%, 100% { opacity: 0.62; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.03); }
      }
      .boot-loading-dots {
        display: flex;
        gap: 8px;
      }
      .boot-loading-dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.25;
        animation: boot-dot 1.4s ease-in-out infinite;
      }
      .boot-loading-dots span:nth-child(2) { animation-delay: 0.18s; }
      .boot-loading-dots span:nth-child(3) { animation-delay: 0.36s; }
      @keyframes boot-dot {
        0%, 100% { opacity: 0.25; transform: translateY(0); }
        40% { opacity: 0.85; transform: translateY(-3px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-loading-seal, .boot-loading-dots span { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" class="boot-splash" role="status" aria-label="Loading rin">
      <div class="boot-loading" aria-hidden="true">
        <img class="boot-loading-seal" src="/app-icon.png" alt="" draggable="false" />
        <div class="boot-loading-dots"><span></span><span></span><span></span></div>
      </div>
    </div>
    <script>
      (() => {
        const splash = document.getElementById('boot-splash')
        if (!splash) return

        const waitForImage = async (image) => {
          if (!image.complete) {
            await new Promise((resolve) => {
              image.addEventListener('load', resolve, { once: true })
              image.addEventListener('error', resolve, { once: true })
            })
          }

          if (image.naturalWidth > 0 && typeof image.decode === 'function') {
            try {
              await image.decode()
            } catch {
              // The load event already confirmed the local asset is available.
            }
          }
        }

        const images = Array.from(splash.querySelectorAll('img'))
        Promise.all(images.map(waitForImage)).then(() => {
          splash.classList.add('boot-splash-assets-ready')
        })
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
